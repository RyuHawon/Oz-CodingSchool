    <body>
        <h1 title="강아지 초코의 프로필 페이지">초 코</h1>
        <img
        src="Img/Choco.jpg"
        alt="초코가 새 겨울옷을 입고 산책나온 사진"
        width="300"
        >
        <div id="introduce">
            <p>안녕하세요. 초코라고 합니다</p>
            <p>동네 고물상에서 태어난지 한달이 되는 날 집으로 입양왔습니다.</p>
            <p>
                가족들이 뭘 하고있는지 기웃거리고 참견하는걸 좋아합니다. <br>
                혼자서도 잘 있지만, 가족이 외출했다가 돌아오면 잔뜩 반겨줍니다.
            </p>
        </div>

        <div id="funfacts">
            <h2>초코의 이모저모</h2>
            <p>
                1. 택배나 <strong>새로운 물건</strong>은 검사하곤 해요.<br>
                2. 낮잠을 많이 자서 밤에 돌아다니며 <mark>가족들을 깨워요.</mark><br>
                3. 잘 때는 혼자인게 편해요.<br>
                4. <em>오른쪽 발</em>은 아무도 못만지게 해요.<br>
            </p>
