<!DOCTYPE html>
<html lang="ko" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="admin.css">
    <title>Admin Page</title>
    
</head>
<body>
    <div class="container mt-3">
        <h3 class="mt-5 mb-3 text-center" id="newitem_title">신규 등록 상품</h3>
        <form class="row row-cols-lg-auto g-3 align-items-center" id="searchForm">
        
            <div class="col-auto">
                <label class="visually-hidden" for="inlineFormSelectPeref">Preference</label>
                <select class="form-select" name="category_data_table" id="inlineFormSelectPeref">
                    <option value="all" disabled hidden selected>카테고리</option>
                    <option value="상의">상의</option>
                    <option value="하의">하의</option>
                    <option value="신발">신발</option>
                    <option value="패션잡화">패션잡화</option>
                </select>
            </div>
            <div class="col-2">
                <select class="form-select" name="gender_data" id="genderSelect">
                    <option value="category">성별</option>
                    <option value="woman">여성 의류</option>
                    <option value="man">남성 의류</option>
                </select>
            </div>
            <div class="col-5">
                <input type="text" class="form-control" id="searched_name" placeholder="제품명을 입력하세요" name="searched_name">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">조회</button>
            </div>
        </form>

        <div class="container mt-3">
            <table class="table table-sm">
                <thead>
                    <tr class="table-info">
                        <th scope="col">카테고리</th>
                        <th scope="col">브랜드</th>
                        <th scope="col">상품명</th>
                        <th scope="col">가격</th>
                    </tr>
                </thead>
                <tbody id="product_data_Table">
                </tbody>
            </table>
            <div>
                <nav aria-label="Page navigation">
                <ul class="pagination">
                    <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                    <li class="page-item"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item"><a class="page-link" href="#">Next</a></li>
                </ul>
                </nav>
            </div>
            <div class="container mt-3 d-flex justify-content-end gap-2">
                <button class="btn btn-outline-secondary btn-sm" onclick="toggleTheme()">다크모드</button>

                <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#signupModal">회원가입</button>
            </div>
        </div>
    </div>

    <div class="modal" id="signupModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">회원가입</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="signupForm">
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon-id">아이디</span>
                            <input type="text" class="form-control" placeholder="아이디" aria-label="아이디 설정" aria-describedby="basic-addon1">
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon-pw">비밀번호</span>
                            <input type="text" class="form-control" placeholder="비밀번호" aria-label="비밀번호 설정" aria-describedby="basic-addon-pw">
                            <div class="form-text ms-2" id="password-addon">* 영문, 숫자, 특수문자를 포함한 8자 이상 30자 미만이어야 합니다.</div>
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon-pwcheck">비밀번호</span>
                            <input type="text" class="form-control" placeholder="비밀번호 확인" aria-label="비밀번호 확인" aria-describedby="basic-addon-pwcheck">
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon-username">이름</span>
                            <input type="text" class="form-control" placeholder="이름을 입력하세요" aria-label="이름 설정" aria-describedby="basic-addon-username">
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon-phone">전화번호</span>
                            <input type="text" class="form-control" placeholder="휴대전화 번호" aria-label="휴대전화 번호 설정" aria-describedby="basic-addon-phone">
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon-gender">성별</span>
                            <select class="form-select" aria-label="성별 선택">
                                <option value="남성" type="radio">남성</option>
                                <option value="여성" type="radio">여성</option>
                                <option value="공개안함" type="radio">공개안함</option>
                            </select>
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon-email">이메일</span>
                            <input type="text" class="form-control" placeholder="email@example.com" aria-label="이메일 입력창" aria-describedby="basic-addon-email">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                    <button type="button" class="btn btn-primary">가입</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="admin.js"></script>

</body>
</html>
