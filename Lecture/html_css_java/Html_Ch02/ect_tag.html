<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>input 외 입력 태그들</title>
    </head>
    <body>
        <fieldset>
            <legend>음료 주문</legend>
            <h2>음료를 고르세요</h2>
            <select multiple size="3">
                <option value="coffee">커피</option>
                <option value="coke">콜라</option>
                <option value="juice" selected>쥬스</option>
                <option value="water">생수</option>
            </select>

            <h2>기타 음료를 원한다면 자유롭게 써주세요</h2>
            <textarea cols="20" rows="10"></textarea>
            <!--사실 텍스트에어리어는 우하단을 클릭하고 크기를 조절해버릴 수 있다.-->
        </fieldset>

        <h2>우리의 준비 상태는 아래와 같습니다</h2>
        <progress max="100" value="80"></progress>

        <h2>추가 용무가 있으면 호출해주세요</h2>
        <button>호출</button>
        <!--클릭도 입력이다, 버튼태그도 인풋이다. 인풋태그에 버튼타입을 사용해도 됨-->
        <input type="button" value="호출">
    </body>
</html>
