{% extends 'base.html' %}
{% block content %}
    <h1>{{ blog.title }}</h1>
    <div style="text-align: right">
        <small>작성자: {{ blog.author.username }} | 작성일시: {{ blog.created_at | date:"Y-m-d"}}</small>
    </div>
    <hr>
    <p>{{ blog.content }}</p>
    <hr>
    {% if user.is_authenticated and user == blog.author %}
        <a href="{% url 'blog_update' blog.pk %}">수정</a>

        <form action="{% url 'blog_delete' blog.pk %}" method="POST" style="display: inline">
            {% csrf_token %}
            <button>글 삭제</button>
        </form>
    {% endif %}
{% endblock %}
