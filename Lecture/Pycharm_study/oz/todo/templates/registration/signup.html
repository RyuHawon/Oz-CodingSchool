{% extends 'base.html' %}

{% block content %}
    <h2>Sign Up</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Sign Up</button>
    </form>
    <p style="margin-top: 20px;">
        Already have an account?
        <a href="{% url 'login' %}">Login here</a>
    </p>
{% endblock %}
