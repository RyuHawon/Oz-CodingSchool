{% extends 'base.html' %}

{% block content %}
    <h2>Login</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Login</button>
    </form>
    <p style="margin-top: 20px;">
        Don't have an account?
        <a href="{% url 'signup' %}">Sign Up here</a>
    </p>
{% endblock %}
