{% extends 'base.html' %}

{% block content %}
    <h2>Create Todo</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Create</button>
        <a href="{% url 'todo_list' %}" class="button" style="margin-left: 5px;">Cancel</a>
    </form>
{% endblock %}
