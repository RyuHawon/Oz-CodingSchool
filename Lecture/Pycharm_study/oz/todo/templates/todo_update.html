{% extends 'base.html' %}

{% block content %}
    <h2>Update Todo</h2>
    <form method="post" class="todo-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="{{ form.title.id_for_label }}" style="display: inline-block; width: 100px;">Title</label>
            {{ form.title }}
        </div>
        <div class="form-group">
            <label for="{{ form.description.id_for_label }}" style="display: inline-block; width: 100px;">Description</label>
            {{ form.description }}
        </div>
        <div class="form-group">
            <label for="{{ form.start_date.id_for_label }}" style="display: inline-block; width: 100px;">Start Date</label>
            {{ form.start_date }}
        </div>
        <div class="form-group">
            <label for="{{ form.end_date.id_for_label }}" style="display: inline-block; width: 100px;">End Date</label>
            {{ form.end_date }}
        </div>
        <div class="form-group">
            <label for="{{ form.is_completed.id_for_label }}" style="display: inline-block; width: 100px;">Completed</label>
            {{ form.is_completed }}
        </div>
        <button type="submit" class="button">Update</button>
        <a href="{% url 'todo_info' pk=form.instance.pk %}" class="button" style="margin-left: 5px;">Cancel</a>
    </form>
{% endblock %}
