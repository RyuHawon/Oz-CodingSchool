{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav>
        <a href="{% url 'todo_list' %}" style="font-size: 1.2em; font-weight: bold;">Todo App</a>
        <div>
            {% if user.is_authenticated %}
                <span>Welcome, {{ user.username }}</span>
                <form action="{% url 'logout' %}" method="POST" style="display: inline; margin-left: 10px;">
                    {% csrf_token %}
                    <button type="submit" class="button">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="button">Login</a>
                <a href="{% url 'signup' %}" class="button" style="margin-left: 5px;">Sign Up</a>
            {% endif %}
        </div>
    </nav>
    <hr>
    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% if messages %}
        <script>
            {% for message in messages %}
                alert("{{ message }}");
            {% endfor %}
        </script>
    {% endif %}
</body>
</html>
